name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-15-intel'
            target: 'x86_64-apple-darwin'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Verify Runner & Python Architecture
        shell: bash
        run: |
          echo "=== Runner OS/Arch ==="
          uname -a || true
          echo "=== Python Architecture ==="
          python -c "import platform; print('Machine:', platform.machine(), '| Architecture:', platform.architecture())"

      - name: Build Python Sidecar
        shell: bash
        run: |
          chmod +x ./scripts/build-sidecar.sh
          ./scripts/build-sidecar.sh ${{ matrix.target }}

      - name: Verify Sidecar Binary Architecture
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          if [[ "$TARGET" == *"windows"* ]]; then
            SIDECAR="frontend/src-tauri/bin/pybridge-${TARGET}.exe"
          else
            SIDECAR="frontend/src-tauri/bin/pybridge-${TARGET}"
          fi

          echo "=== Asserting Sidecar Binary Architecture for target '$TARGET' ==="
          echo "Sidecar path: $SIDECAR"

          if [ ! -f "$SIDECAR" ]; then
            echo "Error: Sidecar binary $SIDECAR does not exist!"
            exit 1
          fi

          if [[ "$TARGET" == *"windows"* ]]; then
            echo "Checking PE header machine type for $SIDECAR..."
            if ! python -c "import struct, sys; data = open(sys.argv[1], 'rb').read(); pe = struct.unpack('<I', data[0x3c:0x40])[0]; m = struct.unpack('<H', data[pe+4:pe+6])[0]; sys.exit(0 if m == 0x8664 else 1)" "$SIDECAR"; then
              echo "Error: Windows PE Machine header is not 0x8664 (x64)!"
              exit 1
            fi
            echo "SUCCESS: Verified Windows binary is 64-bit PE (0x8664)."
          else
            if ! command -v file >/dev/null 2>&1; then
              echo "Error: 'file' command is missing on host runner."
              exit 1
            fi

            FILE_OUT="$(file "$SIDECAR")"
            echo "$FILE_OUT"

            case "$TARGET" in
              aarch64-apple-darwin)
                if ! echo "$FILE_OUT" | grep -qiE "arm64|aarch64"; then
                  echo "Error: Binary architecture mismatch! Expected arm64 for $TARGET, got: $FILE_OUT"
                  exit 1
                fi
                echo "SUCCESS: Verified binary is arm64/aarch64."
                ;;
              x86_64-apple-darwin|x86_64-unknown-linux-gnu)
                if ! echo "$FILE_OUT" | grep -qiE "x86_64|x86-64|amd64"; then
                  echo "Error: Binary architecture mismatch! Expected x86_64 for $TARGET, got: $FILE_OUT"
                  exit 1
                fi
                echo "SUCCESS: Verified binary is x86_64."
                ;;
              *)
                echo "Error: Unrecognized target $TARGET"
                exit 1
                ;;
            esac
          fi

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Expense Tracker v__VERSION__'
          releaseBody: 'Installers for Expense Tracker across supported desktop platforms.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
